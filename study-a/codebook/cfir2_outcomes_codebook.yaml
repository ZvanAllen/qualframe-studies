  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-1b3858e1e56d81401247
  label: 'Outer Setting: G. External Pressure'
  definition: 'The degree to which external pressures drive implementation and/or
    delivery of the innovation. Note: Use this construct to capture themes related
    to External Pressures that are not included in the subconstructs below.'
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-142fdd662fa9993217da
  label: 'Outer Setting: G. External Pressure / 1. Societal Pressure'
  parent_id: cfir-1b3858e1e56d81401247
  definition: The degree to which mass media campaigns, advocacy groups, or social
    movements or protests drive implementation and/or delivery of the innovation.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-7e15d770dbb8e41577e6
