id: cfir-2-outcomes-addendum
version: '1'
name: CFIR 2.0 with the Outcomes Addendum
codes:
- id: cfir-943b0da2ccef1d6f514c
  label: 'Innovation: A. Innovation Source'
  definition: The degree to which the group that developed and/or visibly sponsored
    use of the innovation is reputable, credible, and/or trustable.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-1f45f8805675628aaf15
  label: 'Innovation: B. Innovation Evidence-Base'
  definition: The degree to which the innovation has robust evidence supporting its
    effectiveness.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-4e67cfe7e1c7b9775656
  label: 'Innovation: C. Innovation Relative Advantage'
  definition: The degree to which the innovation is better than other available innovations
    or current practice.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-5765b9757cb6b7922d38
  label: 'Innovation: D. Innovation Adaptability'
  definition: The degree to which the innovation can be modified, tailored, or refined
    to fit local context or needs.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-db100c64625b4c5d1ae9
  label: 'Innovation: E. Innovation Trialability'
  definition: The degree to which the innovation can be tested or piloted on a small
    scale and undone.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-1cd084abf2419b631adc
  label: 'Innovation: F. Innovation Complexity'
  definition: The degree to which the innovation is complicated, which may be reflected
    by its scope and/or the nature and number of connections and steps.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-971d4ec0fc620a903d82
  label: 'Innovation: G. Innovation Design'
  definition: The degree to which the innovation is well designed and packaged, including
    how it is assembled, bundled, and presented.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-93f1df9edb09ef69a075
  label: 'Innovation: H. Innovation Cost'
  definition: The degree to which the innovation purchase and operating costs are
    affordable.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-91668d4505f8bd38cde9
  label: 'Outer Setting: A. Critical Incidents'
  definition: The degree to which to large-scale and/or unanticipated events disrupt
    implementation and/or delivery of the innovation.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-e0c6b6791fc0fd96cdd7
  label: 'Outer Setting: B. Local Attitudes'
  definition: The degree to which sociocultural values (e.g., shared responsibility
    in helping recipients) and beliefs (e.g., convictions about the worthiness of
    recipients) encourage the Outer Setting to support implementation and/or delivery
    of the innovation.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-bbaf14c498dd8187bc37
  label: 'Outer Setting: C. Local Conditions'
  definition: The degree to which economic, environmental, political, and/or technological
    conditions enable the Outer Setting to support implementation and/or delivery
    of the innovation.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-3457226b0498b3f4c86a
  label: 'Outer Setting: D. Partnerships & Connections'
  definition: The degree to which the Inner Setting is networked with external entities,
    including referral networks, academic affiliations, and professional organization
    networks.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-0fc9d980b4b5d54523da
  label: 'Outer Setting: E. Policies & Laws'
  definition: The degree to which legislation, regulations, professional group guidelines
    and recommendations, or accreditation standards support implementation and/or
    delivery of the innovation.
  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: cfir-de8489aa1ed90c551e44
  label: 'Outer Setting: F. Financing'
  definition: The degree to which funding from external entities (e.g., grants, reimbursement)
