  inclusion_guidance: ''
  exclusion_guidance: ''
  examples: []
  active: true
- id: '9.3'
  label: Comparative imagining of future outcomes
  parent_id: G9
  definition: 'BCIO:007070 | prompt comparative imagining of future outcomes BCT

    An <increase awareness of consequences BCT> that guides the person to imagine
