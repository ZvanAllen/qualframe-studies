- id: '11.1'
  label: Pharmacological support
  parent_id: G11
  definition: "BCIO:007144 | promote pharmacological support BCT\nA <behaviour change\
    \ technique> promoting medicines or other drugs.\n\nBCIO:007145 | provide pharmacological\
